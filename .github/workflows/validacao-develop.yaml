name: Valida Build & Test

on:
  push:
    branches:
      - develop 
jobs:

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  valida-backend:
    name: Validação Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/valida-backend.yaml

  valida-frontend:
    name: Validação Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/valida-frontend.yaml

  create-pr:
    name: "Criar PR para Master"
    needs: [valida-backend, valida-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extrai o nome da branch atual
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          # Verifica se já existe um PR aberto para essa branch
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --base master --json number --jq 'length')
          
          if [ "$PR_EXISTS" -eq "0" ]; then
            echo "Criando novo PR..."
            gh pr create \
              --title "feat: Merge $BRANCH_NAME na master" \
              --body "Pull Request criado automaticamente via GitHub Actions após push na branch \`$BRANCH_NAME\`." \
              --base master \
              --head "$BRANCH_NAME"
          else
            echo "PR já existe para esta branch. Nenhuma ação necessária."
          fi