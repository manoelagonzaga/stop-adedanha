name: Validação Frontend

on:
  workflow_call:

jobs:
  lint-front:
    name: Lint
    runs-on: ubuntu-latest
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci

      - name: Executar o Lint
        working-directory: ./frontend
        run: npm run lint

  build-front:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-front
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci

      - name: Executar o Build
        working-directory: ./frontend
        run: npm run build

  test-front:
    name: Teste
    runs-on: ubuntu-latest
    needs: build-front
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci

      - name: Executar o Teste unitário
        working-directory: ./frontend
        run: npm run test