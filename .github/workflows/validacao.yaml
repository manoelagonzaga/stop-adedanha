name: Valida Build & Test

on:
  push:
    branches:
      - develop 
jobs:
  lint-back:
    name: Lint Backend
    runs-on: ubuntu-latest
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Instalar dependências
        working-directory: ./backend
        run: npm ci

      - name: Executar o Lint
        working-directory: ./backend
        run: npm run lint

  build-back:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint-back
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Instalar dependências
        working-directory: ./backend
        run: npm ci

      - name: Executar o Build
        working-directory: ./backend
        run: npm run build

  test-back:
    name: Teste unitário Backend
    runs-on: ubuntu-latest
    needs: build-back
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Instalar dependências
        working-directory: ./backend
        run: npm ci

      - name: Executar o Teste unitário
        working-directory: ./backend
        run: npm run test


  lint-front:
    name: Lint Frontend
    runs-on: ubuntu-latest
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci

      - name: Executar o Lint
        working-directory: ./frontend
        run: npm run lint

  build-front:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-front
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci

      - name: Executar o Build
        working-directory: ./frontend
        run: npm run build

  test-front:
    name: Teste Unitário Frontend
    runs-on: ubuntu-latest
    needs: build-front
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci

      - name: Executar o Teste unitário
        working-directory: ./frontend
        run: npm run test